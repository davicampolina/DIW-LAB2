<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AlugaCarros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">AlugaCarros</a>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-body p-4">
            <h1 class="h4 mb-1">Entrar</h1>
            <p class="text-muted mb-4">Acesse o sistema de aluguel de carros.</p>

            <form id="form-login">
              <div class="mb-3">
                <label class="form-label d-block">Entrar como</label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="perfil" id="perfil-cliente" value="cliente" checked>
                  <label class="btn btn-outline-primary" for="perfil-cliente">Cliente</label>
                  <input type="radio" class="btn-check" name="perfil" id="perfil-agente" value="agente">
                  <label class="btn btn-outline-primary" for="perfil-agente">Agente (empresa ou banco)</label>
                </div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
              </div>

              <div id="mensagem" class="alert alert-danger d-none"></div>

              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">
              Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/servicos/loginServico.js"></script>
  <script src="js/paginas/login.js"></script>
</body>
</html>
