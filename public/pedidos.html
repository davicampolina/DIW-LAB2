<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus pedidos - AlugaCarros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="pedidos.html">AlugaCarros</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav me-auto">
          <a class="nav-link active" href="pedidos.html">Meus pedidos</a>
          <a class="nav-link" href="perfil.html">Meus dados</a>
        </div>
        <span class="navbar-text me-3" id="nome-usuario"></span>
        <button class="btn btn-outline-light btn-sm" id="btn-sair">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 card-title" id="titulo-form">Novo pedido de aluguel</h2>
            <form id="form-pedido">
              <input type="hidden" id="pedido-id">
              <div class="mb-3">
                <label for="automovel" class="form-label">Automóvel</label>
                <select class="form-select" id="automovel" required></select>
              </div>
              <div class="mb-3">
                <label for="data-inicio" class="form-label">Data de retirada</label>
                <input type="date" class="form-control" id="data-inicio" required>
              </div>
              <div class="mb-3">
                <label for="data-fim" class="form-label">Data de devolução</label>
                <input type="date" class="form-control" id="data-fim" required>
              </div>

              <div id="mensagem" class="alert d-none"></div>

              <button type="submit" class="btn btn-primary w-100" id="btn-enviar">Enviar pedido</button>
              <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btn-cancelar-edicao">Cancelar edição</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 card-title">Meus pedidos</h2>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Feito em</th>
                    <th>Automóvel</th>
                    <th>Período</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tabela-pedidos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/servicos/automoveisServico.js"></script>
  <script src="js/servicos/pedidosServico.js"></script>
  <script src="js/paginas/pedidos.js"></script>
</body>
</html>
