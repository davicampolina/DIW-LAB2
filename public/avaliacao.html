<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de pedidos - AlugaCarros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="avaliacao.html">AlugaCarros</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav me-auto">
          <a class="nav-link active" href="avaliacao.html">Pedidos</a>
          <a class="nav-link" href="clientes.html">Clientes</a>
        </div>
        <span class="navbar-text me-3" id="nome-usuario"></span>
        <button class="btn btn-outline-light btn-sm" id="btn-sair">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h3 mb-0">Pedidos de aluguel</h1>
      <div class="d-flex align-items-center gap-2">
        <label for="filtro-status" class="text-nowrap">Mostrar:</label>
        <select class="form-select" id="filtro-status">
          <option value="">Todos</option>
          <option>Em análise</option>
          <option>Aprovado</option>
          <option>Reprovado</option>
          <option>Contratado</option>
          <option>Cancelado</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Renda total</th>
                <th>Automóvel</th>
                <th>Período</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-pedidos"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal de análise do pedido -->
  <div class="modal fade" id="modal-analise" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5">Analisar pedido</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <h3 class="h6">Dados do cliente</h3>
          <div id="dados-cliente" class="mb-3"></div>

          <h3 class="h6">Pedido</h3>
          <div class="row g-3">
            <div class="col-12">
              <label for="analise-automovel" class="form-label">Automóvel</label>
              <select class="form-select" id="analise-automovel"></select>
            </div>
            <div class="col-md-6">
              <label for="analise-inicio" class="form-label">Retirada</label>
              <input type="date" class="form-control" id="analise-inicio">
            </div>
            <div class="col-md-6">
              <label for="analise-fim" class="form-label">Devolução</label>
              <input type="date" class="form-control" id="analise-fim">
            </div>
            <div class="col-12">
              <label for="analise-parecer" class="form-label">Parecer financeiro</label>
              <textarea class="form-control" id="analise-parecer" rows="3" placeholder="Ex.: renda compatível com o valor do aluguel."></textarea>
            </div>
          </div>
          <div id="mensagem-analise" class="alert alert-danger d-none mt-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary me-auto" id="btn-salvar-pedido">Salvar alterações</button>
          <button type="button" class="btn btn-danger" id="btn-reprovar">Reprovar</button>
          <button type="button" class="btn btn-success" id="btn-aprovar">Aprovar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para executar o contrato de um pedido aprovado -->
  <div class="modal fade" id="modal-contrato" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5">Executar contrato</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="resumo-pedido" class="mb-3"></div>

          <div class="mb-3">
            <label for="tipo-propriedade" class="form-label">Automóvel fica registrado como propriedade de</label>
            <select class="form-select" id="tipo-propriedade">
              <option value="Cliente">Cliente</option>
              <option value="Empresa">Empresa</option>
              <option value="Banco">Banco</option>
            </select>
          </div>
          <div class="mb-3 d-none" id="grupo-proprietario">
            <label for="proprietario-agente" class="form-label">Qual agente?</label>
            <select class="form-select" id="proprietario-agente"></select>
          </div>

          <div class="border rounded p-3 d-none" id="grupo-credito">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tem-credito">
              <label class="form-check-label" for="tem-credito">Associar contrato de crédito deste banco</label>
            </div>
            <label for="valor-credito" class="form-label">Valor do crédito (R$)</label>
            <input type="number" class="form-control" id="valor-credito" min="0" step="0.01" disabled>
          </div>

          <div id="mensagem-contrato" class="alert alert-danger d-none mt-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
          <button type="button" class="btn btn-success" id="btn-confirmar-contrato">Confirmar contrato</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/servicos/clientesServico.js"></script>
  <script src="js/servicos/automoveisServico.js"></script>
  <script src="js/servicos/pedidosServico.js"></script>
  <script src="js/servicos/agentesServico.js"></script>
  <script src="js/servicos/contratosServico.js"></script>
  <script src="js/paginas/avaliacao.js"></script>
</body>
</html>
