<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - AlugaCarros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="avaliacao.html">AlugaCarros</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="avaliacao.html">Pedidos</a>
          <a class="nav-link active" href="clientes.html">Clientes</a>
        </div>
        <span class="navbar-text me-3" id="nome-usuario"></span>
        <button class="btn btn-outline-light btn-sm" id="btn-sair">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="h3 mb-4">Cadastro de Clientes</h1>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5 card-title" id="titulo-form">Novo cliente</h2>

        <form id="form-cliente">
          <input type="hidden" id="cliente-id">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="col-md-3">
              <label for="rg" class="form-label">RG</label>
              <input type="text" class="form-control" id="rg" required>
            </div>
            <div class="col-md-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
            </div>
            <div class="col-md-8">
              <label for="endereco" class="form-label">Endereço</label>
              <input type="text" class="form-control" id="endereco" required>
            </div>
            <div class="col-md-4">
              <label for="profissao" class="form-label">Profissão</label>
              <input type="text" class="form-control" id="profissao" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" required>
            </div>
          </div>

          <h3 class="h6 mt-4">Rendimentos (até 3 empregadores)</h3>
          <div id="rendimentos">
            <div class="row g-2 mb-2">
              <div class="col-8"><input type="text" class="form-control empregador" placeholder="Entidade empregadora 1"></div>
              <div class="col-4"><input type="number" class="form-control valor" placeholder="Valor (R$)" min="0" step="0.01"></div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-8"><input type="text" class="form-control empregador" placeholder="Entidade empregadora 2"></div>
              <div class="col-4"><input type="number" class="form-control valor" placeholder="Valor (R$)" min="0" step="0.01"></div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-8"><input type="text" class="form-control empregador" placeholder="Entidade empregadora 3"></div>
              <div class="col-4"><input type="number" class="form-control valor" placeholder="Valor (R$)" min="0" step="0.01"></div>
            </div>
          </div>

          <div id="mensagem" class="alert d-none mt-3"></div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="btn-salvar">Cadastrar</button>
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 card-title">Clientes cadastrados</h2>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Profissão</th>
                <th>Renda total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-clientes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/servicos/clientesServico.js"></script>
  <script src="js/paginas/clientes.js"></script>
</body>
</html>
